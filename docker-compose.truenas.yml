# Slick on this TrueNAS (SCALE 24.04+), as a Custom App: paste this file
# into Apps → Discover Apps → ⋮ → Install via YAML.
#
# Where the data lives:
#
#   slick-postgres (a Docker volume)   the database — the same setup as
#                                      the other postgres apps on this NAS,
#                                      so no host permissions to fight
#   /mnt/vault/Vault/Etc/Slick/storage   uploaded files, in the Etc share
#                                      (visible at /Volumes/Etc/Slick
#                                      from the Mac)
#
# The storage folder already exists; the volume is made on first start
# and survives redeploys and upgrades. (Deleting the app offers to
# delete its volumes too — say no unless you mean it.)
#
# Then choose the database password (both places marked CHANGEME):
# letters and digits only — it also travels inside the ODBC connection
# string, where `;` and braces have meaning. Make one with:
#
#   openssl rand -base64 24 | tr -dc A-Za-z0-9
#
# Slick listens on 30900, plain HTTP: open http://<nas>:30900,
# register, and create an organization. To upgrade, change the image
# tag to the new release and redeploy; the volume and the folder
# keep the data.
services:
  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: "Driver={PostgreSQL Unicode};Server=db;Port=5432;Database=slick;Uid=slick;Pwd=efeg7rrMO8StRU1kXwR1T5Lpt28I9H8"
      HOST: 0.0.0.0
      METRO_ENV: production
      PORT: 4000
    image: ghcr.io/akoskovacs/slick:0.1
    ports:
      - '30900:4000'
    restart: unless-stopped
    volumes:
      - /mnt/vault/Vault/Etc/Slick/storage:/app/storage

  db:
    environment:
      POSTGRES_DB: slick
      POSTGRES_PASSWORD: efeg7rrMO8StRU1kXwR1T5Lpt28I9H8
      POSTGRES_USER: slick
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slick -d slick"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:17
    restart: unless-stopped
    volumes:
      - slick-postgres:/var/lib/postgresql/data

volumes:
  slick-postgres:
